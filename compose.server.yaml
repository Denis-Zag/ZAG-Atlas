name: zag-atlas-server
services:
  atlas:
    build: .
    env_file:
      - path: .env.server
        format: raw
    environment:
      SEARCH_MODE: hybrid
      QDRANT_URL: http://qdrant:6333
      SESSION_COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      - qdrant
    volumes:
      - atlas-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2.11.8-alpine
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?Укажите домен через install.sh}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      atlas:
        condition: service_healthy
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  atlas-data:
  qdrant-data:
  caddy-data:
  caddy-config:
