name: zag-atlas
services:
  atlas:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      SEARCH_MODE: hybrid
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - atlas-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  qdrant-data:
  atlas-data:
